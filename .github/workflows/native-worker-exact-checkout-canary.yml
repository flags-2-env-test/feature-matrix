name: Native worker exact-checkout canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-worker-exact-checkout-canary.yml"
      - "native-worker-exact-checkout/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-worker-exact-checkout-canary.yml"
      - "native-worker-exact-checkout/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHA_INDIE_WORKER_SHA: 3ad79f6cb48de5d380372c37a063a0abadbe456d
  SUCCESS_FIXTURE_REPOSITORY: https://github.com/flags-2-env-test/sops-just.git
  SUCCESS_FIXTURE_SHA: 933a239388449901bf8cccfd3db5c4d79fdec039
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  consumer:
    name: Consumer exact checkout (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
          - os: windows-2025
            platform: windows
            architecture: x64
          - os: macos-15
            platform: macos
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out exact consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact worker candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gha-indie-worker/gha-indie-worker.rs
          ref: ${{ env.GHA_INDIE_WORKER_SHA }}
          path: .gha-indie-worker
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify immutable worker candidate and policy
        run: >-
          python -c "import json,pathlib,subprocess;
          expected='${{ env.GHA_INDIE_WORKER_SHA }}';
          actual=subprocess.run(['git','-C','.gha-indie-worker','rev-parse','HEAD'],check=True,text=True,stdout=subprocess.PIPE).stdout.strip();
          assert actual==expected;
          policy=json.loads(pathlib.Path('.gha-indie-worker/policy/native-worker-execution-v1.json').read_text(encoding='utf-8'));
          assert policy['productionReadinessClaimed'] is False;
          assert policy['checkout']['exactLowercaseCommitSha'] is True;
          assert policy['checkout']['fallbackBranchOrTag'] is False;
          assert policy['gitEnvironment']['inheritedInjectedConfig'] is False;
          assert policy['gitEnvironment']['replaceObjects'] is False;
          assert policy['evidence']['contentDigestCoversEveryField'] is True"

      - name: Compile independent canary
        run: python -m py_compile native-worker-exact-checkout/run_canary.py

      - name: Run worker handoff and checkout corpus externally
        working-directory: .gha-indie-worker
        run: >-
          python -m unittest -v
          tests/test_native_worker_handoff.py
          tests/test_native_worker_checkout.py
          tests/test_native_worker_handoff_integration.py

      - name: Prove gitlinks fail closed and a clean fixture succeeds
        run: >-
          python native-worker-exact-checkout/run_canary.py
          --worker-dir .gha-indie-worker
          --submodule-repository-url "https://github.com/${{ github.repository }}.git"
          --submodule-commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --success-repository-url "${{ env.SUCCESS_FIXTURE_REPOSITORY }}"
          --success-commit-sha "${{ env.SUCCESS_FIXTURE_SHA }}"
          --workspace-root "${{ runner.temp }}/external-native-worker-canary"
          --evidence "${{ runner.temp }}/external-native-worker-evidence.json"
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"

      - name: Ratchet positive checkout evidence
        run: >-
          python -c "import json,os,pathlib;
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'external-native-worker-evidence.json').read_text(encoding='utf-8'));
          expected=os.environ['SUCCESS_FIXTURE_SHA'];
          assert value['requestedCommitSha']==expected==value['resolvedCommitSha'];
          assert value['detachedHead'] is True;
          assert value['remotes']==['origin'];
          assert value['submoduleGitlinks']==[];
          assert value['originUrl']==os.environ['SUCCESS_FIXTURE_REPOSITORY'];
          assert value['evidenceDigest'].startswith('sha256:')"

      - name: Verify both tracked checkouts remain unchanged
        run: >-
          python -c "import subprocess;
          roots=['.', '.gha-indie-worker'];
          commands=[['git','-C',root,'diff','--exit-code'] for root in roots]
          +[['git','-C',root,'diff','--cached','--exit-code'] for root in roots];
          [subprocess.run(command,check=True) for command in commands]"
