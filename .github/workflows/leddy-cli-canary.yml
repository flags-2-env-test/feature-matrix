name: Leddy CLI flags canary

on:
  pull_request:
    paths:
      - ".github/workflows/leddy-cli-canary.yml"
      - "scripts/leddy-cli-canary.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/leddy-cli-canary.yml"
      - "scripts/leddy-cli-canary.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leddy-cli-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEDDY_CLI_REF: 5adb8c6f09530c838cc8daf30ed606c286ca1edd

jobs:
  cli-contract:
    name: Leddy CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Require immutable Leddy pin
        run: |
          set -euo pipefail
          [[ "$LEDDY_CLI_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact Leddy CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: led-dynamo/leddy-cli
          ref: ${{ env.LEDDY_CLI_REF }}
          path: leddy-cli
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: leddy-cli
          shared-key: leddy-cli-flags-${{ matrix.os }}

      - name: Build and validate exact Leddy CLI
        run: |
          set -euo pipefail
          bash -n harness/scripts/leddy-cli-canary.sh
          cargo fmt --all --check --manifest-path leddy-cli/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path leddy-cli/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path leddy-cli/Cargo.toml
          cargo build --locked --release --manifest-path leddy-cli/Cargo.toml --bin leddy

      - name: Exercise flags-2-env contract through Leddy
        env:
          LEDDY_FLAGS_CONFIG: ${{ github.workspace }}/leddy-cli/.cli-flags.toml
        run: |
          set -o pipefail
          test -f "$LEDDY_FLAGS_CONFIG"
          bash harness/scripts/leddy-cli-canary.sh \
            "$GITHUB_WORKSPACE/leddy-cli/target/release/leddy" \
            2>&1 | tee "$RUNNER_TEMP/leddy-cli-canary.log"

      - name: Upload bounded diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leddy-cli-flags-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leddy-cli-canary.log
          if-no-files-found: warn
          retention-days: 7
