name: one-use PR 27 hardening materializer

on:
  push:
    branches:
      - agent/pr27-hardening-certification

permissions:
  contents: write

concurrency:
  group: pr27-hardening-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify scope and materialize independent test
        shell: bash
        env:
          BASE_SHA: 9a073ad643dd81135bf411820fb343ad7290ec7d
          SCRIPT_SHA256: b655f5243da5be0d5e46c3e1e1e48fc96bf078f74e53fd47872464b4fcf27227
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/pr27-hardening-certification"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD

          actual_paths="$(git diff --name-only "${BASE_SHA}"..HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            .github/agent-carriers/pr27-hardening/test-pr27.py.gz.b64.part-00 \
            .github/agent-carriers/pr27-hardening/test-pr27.py.gz.b64.part-01 \
            .github/workflows/pr27-hardening-certification.yml \
            .github/workflows/pr27-hardening-materialize.yml \
            pr27-hardening/candidate.sha | LC_ALL=C sort)"
          test "${actual_paths}" = "${expected_paths}"

          mkdir -p pr27-hardening
          cat .github/agent-carriers/pr27-hardening/test-pr27.py.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/test_pr27.py
          printf '%s  %s\n' "${SCRIPT_SHA256}" /tmp/test_pr27.py | sha256sum -c -
          install -m 0755 /tmp/test_pr27.py pr27-hardening/test_pr27.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile pr27-hardening/test_pr27.py

          candidate="$(tr -d '[:space:]' < pr27-hardening/candidate.sha)"
          [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]

          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            .github/workflows/pr27-hardening-certification.yml \
            pr27-hardening/candidate.sha \
            pr27-hardening/test_pr27.py; then
            echo 'credential-shaped content detected' >&2
            exit 1
          fi

      - name: Commit permanent certification harness only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-carriers/pr27-hardening
          rm .github/workflows/pr27-hardening-materialize.yml
          rm -rf pr27-hardening/__pycache__

          git add -A
          git diff --cached --check

          actual_staged_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_staged_paths="$(printf '%s\n' \
            .github/agent-carriers/pr27-hardening/test-pr27.py.gz.b64.part-00 \
            .github/agent-carriers/pr27-hardening/test-pr27.py.gz.b64.part-01 \
            .github/workflows/pr27-hardening-materialize.yml \
            pr27-hardening/test_pr27.py | LC_ALL=C sort)"
          test "${actual_staged_paths}" = "${expected_staged_paths}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: add adversarial PR 27 certification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
