name: DEN-3173 one-use help-width materializer

on:
  push:
    branches:
      - agent/pr27-hardening-certification

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact harness branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Isolate the help-width contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pr27-hardening/test_pr27.py")
          source = path.read_text()
          marker = "def assert_help_width(binary: Path) -> None:\n"
          replacement = marker + "    workspace = tempfile.TemporaryDirectory(prefix=\"f2e-help-width-\")\n    root = Path(workspace.name)\n    write_tty_contract(root)\n"
          if source.count(marker) != 1:
              raise SystemExit("expected exactly one help-width function")
          source = source.replace(marker, replacement, 1)
          old_run = 'result = run((binary, "--help"), env=env)'
          new_run = 'result = run((binary, "--help"), cwd=root, env=env)'
          if source.count(old_run) != 2:
              raise SystemExit("expected exactly two help-width invocations")
          path.write_text(source.replace(old_run, new_run))
          PY
          python3 -m py_compile pr27-hardening/test_pr27.py
          git diff --check

      - name: Remove carrier and publish the harness fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-3173-help-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr27-hardening/test_pr27.py .github/workflows/materialize-den-3173-help-width.yml
          git diff --cached --check
          git commit -m "test(DEN-3173): isolate help-width contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
