name: DEN-3173 one-use help-width materializer

on:
  push:
    branches:
      - agent/pr27-hardening-certification

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact harness branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Isolate the help-width contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pr27-hardening/test_pr27.py")
          source = path.read_text()
          old = '''def assert_help_width(binary: Path) -> None:
              env = controlled_env()
              env["F2E_FORCE_STDOUT_TTY"] = "0"
              env["F2E_FORCE_STDERR_TTY"] = "0"
              result = run((binary, "--help"), env=env)
              require(result.returncode == 0, result.stderr)
              first = result.stdout.splitlines()[0]
              require(len(first) == 80, f"piped help width is {len(first)}, expected 80")

              env["COLUMNS"] = "140"
              result = run((binary, "--help"), env=env)
              require(result.returncode == 0, result.stderr)
              first = result.stdout.splitlines()[0]
              require(len(first) == 140, f"COLUMNS=140 produced width {len(first)}")
'''
          new = '''def assert_help_width(binary: Path) -> None:
              with tempfile.TemporaryDirectory(prefix="f2e-help-width-") as tmp:
                  root = Path(tmp)
                  write_tty_contract(root)
                  env = controlled_env()
                  env["F2E_FORCE_STDOUT_TTY"] = "0"
                  env["F2E_FORCE_STDERR_TTY"] = "0"
                  result = run((binary, "--help"), cwd=root, env=env)
                  require(result.returncode == 0, result.stderr)
                  first = result.stdout.splitlines()[0]
                  require(len(first) == 80, f"piped help width is {len(first)}, expected 80")

                  env["COLUMNS"] = "140"
                  result = run((binary, "--help"), cwd=root, env=env)
                  require(result.returncode == 0, result.stderr)
                  first = result.stdout.splitlines()[0]
                  require(len(first) == 140, f"COLUMNS=140 produced width {len(first)}")
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one help-width function, found {count}")
          path.write_text(source.replace(old, new))
          PY
          python3 -m py_compile pr27-hardening/test_pr27.py
          git diff --check

      - name: Remove carrier and publish the harness fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-3173-help-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr27-hardening/test_pr27.py .github/workflows/materialize-den-3173-help-width.yml
          git diff --cached --check
          git commit -m "test(DEN-3173): isolate help-width contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
